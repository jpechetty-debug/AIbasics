{% extends 'base.html' %}

{% block title %}Reset Password - AI Mastery{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 p-8 text-center">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Reset Password</h1>
                <p class="text-blue-200 mt-2">Enter your email to receive reset instructions</p>
            </div>

            <div class="p-8">
                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label for="id_email" class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                        <input type="email" name="email" id="id_email" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="your@email.com">
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white py-3 rounded-xl font-semibold transition shadow-lg">
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="{% url 'users:login' %}" class="text-blue-600 hover:text-blue-700 font-medium">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
