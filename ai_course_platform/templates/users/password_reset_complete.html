{% extends 'base.html' %}

{% block title %}Password Updated - AI Mastery{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 p-8 text-center">
                <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Password Updated</h1>
                <p class="text-blue-200 mt-2">Your security settings have been updated</p>
            </div>

            <div class="p-8 text-center">
                <p class="text-slate-600 mb-6">
                    Your password has been set. You may now log in with your new credentials.
                </p>
                <a href="{% url 'users:login' %}" 
                   class="inline-block w-full py-3 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white rounded-xl font-semibold transition shadow-lg">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
